name: Supabase Keepalive

on:
  schedule:
    - cron: '21 9 * * *'  # daily — GitHub Actions schedules can be delayed/skipped, so don't rely on the full 7-day margin
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to keepalive row
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            -X PATCH \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
