name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent:
    # Skip drafts, and only react to comments that are PR-Agent slash commands
    if: >
      ${{ github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false ||
       github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free-tier Gemini via Google AI Studio
          config.model: "gemini/gemini-flash-latest"
          config.fallback_models: '["gemini/gemini-flash-latest"]'
          config.custom_model_max_tokens: "100000"
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
